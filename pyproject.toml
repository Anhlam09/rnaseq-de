[project]
name = "rnaseq-de"
version = "0.1.0"
description = "Lightweight differential expression analysis for bulk RNA-seq counts"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
